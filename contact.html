<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Augustus Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            text-align: center;
            padding: var(--spacing-xl) 0 var(--spacing-lg);
        }
        .page-header h1 {
            font-size: 3.5rem;
            margin-bottom: var(--spacing-sm);
        }
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            margin-top: var(--spacing-lg);
        }
        .form-group {
            margin-bottom: var(--spacing-md);
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--ast-border-color, #cbd5e1);
            border-radius: 8px;
            font-family: inherit;
        }
        .contact-info h3 {
            margin-bottom: var(--spacing-md);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: var(--spacing-sm);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Navigation -->
        <header>
            <div class="logo">
                AUGUSTUS
                <span>EDUCATION</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="program.html">Program</a></li>
                    <li><a href="admission.html">Admission</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <a href="#" class="btn btn-light">Enroll now</a>
        </header>

        <div class="page-header">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
        </div>

        <section class="section" style="padding-top: 0;">
            <div class="contact-grid">
                
                <!-- Contact Form -->
                <div class="contact-form">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="(123) 456-7890">
                        </div>
                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <textarea id="message" rows="5" class="form-control" placeholder="How can we help you?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark">Send Message</button>
                    </form>
                </div>

                <!-- Contact Info -->
                <div class="contact-info">
                    <div class="card">
                        <h3>Our Office</h3>
                        <div class="info-item">
                            <div class="phone-icon" style="width:30px; height:30px; font-size:0.8rem;">📍</div>
                            <p>123 Education Lane<br>Learning City, ST 12345</p>
                        </div>
                        <div class="info-item" style="margin-top: 20px;">
                            <div class="phone-icon" style="width:30px; height:30px; font-size:0.8rem;">📞</div>
                            <p>823-823-5555</p>
                        </div>
                        <div class="info-item" style="margin-top: 20px;">
                            <div class="phone-icon" style="width:30px; height:30px; font-size:0.8rem;">✉️</div>
                            <p>info@augustuseducation.in</p>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
